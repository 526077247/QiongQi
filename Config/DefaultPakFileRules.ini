; ============================================================================
; PakFileRules 打包文件分配规则
; 规则按顺序应用，每个文件只匹配第一个命中的规则段，其余规则不再评估
; 注释以分号（;）开头
; ============================================================================

[ExcludeDefault]
; 指定需要应用此规则的目标平台（大小写不敏感；Windows 对应 Win64）
Platforms="Windows,Android,iOS"
; 指定构建配置（区分大小写，拼写须准确）
Targets="Shipping,Development,Debug"
; 命中此规则的文件将被排除出所有 PAK 文件（含首包 chunk0 与 CDN chunk100）
bExcludeFromPaks=true
; 允许覆盖 chunk manifest 中已有的文件分配
bOverrideChunkManifest=true

; ===================== 排除引擎 Editor 相关内容 =====================
; 参考官方 BasePakFileRules.ini 示例：编辑器 UI 图标、教程、编辑器网格与材质等
+Files=".../Engine/Content/Slate/Icons/*"
+Files=".../Engine/Content/Slate/Tutorials/*"
+Files=".../Engine/Content/EditorMeshes/Camera/*"
+Files=".../Engine/Content/EditorMaterials/MatineeGroups/*"
+Files=".../Content/Debug/*"

; ===================== JavaScript：仅排除 Editor 专用目录 =====================
; 注意（UE 5.7 语义）：ini 中的 "-Files=xxx" 只会对低优先级配置中"完全相等的值"做移除，
; 并不会把 "-" 前缀的排除规则传给 FileFilter，因此无法用 -Files 实现"默认全排 + 白名单放行"。
; 正确写法：对需要排除的目录显式写 "+Files" 模式（与引擎自身 BasePakFileRules.ini 一致）。
; Content/JavaScript 下仅 PuertsEditor 为编辑器专用（含 node_modules 开发依赖，约 25MB），
; 其余（Code/Mono/puerts/ThirdParty/utils/wasm/ffi/Start.js）均为运行时脚本，保持进包：
+Files=".../Content/JavaScript/PuertsEditor/*"

; ===================== AssetsPackage：全部为运行时资源 =====================
; AssetsPackage 下无 Editor 相关内容，不在此规则排除范围内，保持默认进包：
; - uasset/umap 由 cook 流程按 chunk manifest 打进 PAK
; - 非资产文件（json 等）由 DirectoriesToAlwaysStageAsUFS 打进 PAK
